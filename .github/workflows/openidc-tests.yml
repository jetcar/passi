name: OpenIDC OAuth tests

on:
  pull_request:
    paths:
      - 'OpenIDC/**'
      - 'OpenIDCTests/**'
      - 'RedisClient/**'
      - '.github/workflows/openidc-tests.yml'

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      PASSI_TEST_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test OpenIDCTests/OpenIDCTests.csproj --configuration Release --nologo
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: OpenIDC/vue-project
      - run: npm run build && npm test
        working-directory: OpenIDC/vue-project
